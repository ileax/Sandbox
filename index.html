<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox - Электрические цепи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="controls">
            <div class="palette-item" data-type="red" title="Источник">
                <img src="Assets/psu.png" alt="PSU" class="palette-icon" draggable="false">
            </div>
            <div class="palette-item" data-type="blue" title="Провод">
                <img src="Assets/wire_horizontal.png" alt="Wire" class="palette-icon" draggable="false">
            </div>
            <div class="palette-item" data-type="green" title="Лампа">
                <img src="Assets/lampoff.png" alt="Lamp" class="palette-icon" draggable="false">
            </div>
            <div class="palette-item" data-type="switch" title="Переключатель">
                <img src="Assets/switch_off.png" alt="Switch" class="palette-icon" draggable="false">
            </div>
            <div class="palette-item" data-type="repeater" title="Усилитель">
                <img src="Assets/repeater_right.png" alt="Repeater" class="palette-icon" draggable="false">
            </div>
            <div class="palette-item" data-type="inverter" title="Инвертор">
                <img src="Assets/inverter_right.png" alt="Inverter" class="palette-icon" draggable="false">
            </div>
        </div>
    </div>
    <div id="info">
        🖱️ Левая кнопка - разместить/взаимодействовать | Правая кнопка - стереть
    </div>

    <script src="script.js"></script>
</body>
</html>
